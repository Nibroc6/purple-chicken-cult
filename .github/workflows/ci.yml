# CI (SCAFFOLD; plan "SCAFFOLD-0a" deliverable 3). Actions are pinned by commit SHA
# (tags resolved 2026-10-01).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PCC_ENV: test
  PCC_TEST_DATABASE_URL: postgres://pcc:pcc@localhost:54329/pcc_test?sslmode=disable
  PCC_ADMIN_DATABASE_URL: postgres://pcc:pcc@localhost:54329/pcc_test?sslmode=disable
  PCC_REQUIRE_DB: "1"

jobs:
  # Minutes matter (private repo, Free plan: 2,000/month, each job rounded up to
  # the minute), so jobs stay few and the browser tests do not run per push:
  # - go + web: every PR push, pushes to main, manual runs.
  # - e2e: daily against claude/phase-1 (skipped when that commit already passed;
  #   a failure opens or updates an issue), and manual runs on any branch.
  # - perf: daily, or a "[perf]" commit.
  go:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres: &postgres
        image: postgres:18
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc
          POSTGRES_DB: pcc_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U pcc -d pcc_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: false
      # Own cache key: -race objects differ from the plain builds the other jobs save.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-race-${{ runner.os }}-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Throwaway data: no fsync. (Separate -c flags: ALTER SYSTEM refuses a
      # multi-statement string, which psql sends as one transaction.)
      - name: postgres for tests (no fsync)
        run: &pgfast |
          docker exec ${{ job.services.postgres.id }} psql -U pcc -d pcc_test -q -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" -c "SELECT pg_reload_conf()"
      - name: npm ci
        run: npm ci --prefix web
      - name: generate
        run: bash scripts/gen.sh
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: go vet
        run: go vet ./...
      - name: go test (race)
        run: go test -race -count=1 -p 4 ./...

  web:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci --prefix web
      - name: generate
        run: bash scripts/gen.sh
      - name: ownership self-test
        run: node scripts/ownership.mjs selftest
      - name: web lint / typecheck / unit
        run: |
          npm --prefix web run lint
          npm --prefix web run typecheck
          npm --prefix web test
      - name: build
        run: bash scripts/build.sh

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    env:
      # Scheduled runs use the workflow on main; test the integration branch.
      E2E_REF: ${{ github.event_name == 'schedule' && 'claude/phase-1' || github.ref }}
    services:
      postgres: *postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.E2E_REF }}
      - name: commit under test
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # A marker cache per commit that passed; a daily run on an unchanged branch stops here.
      - name: already green?
        id: green
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-green
          key: e2e-green-${{ steps.head.outputs.sha }}
          lookup-only: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.green.outputs.cache-hit != 'true'
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.green.outputs.cache-hit != 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: postgres for tests (no fsync)
        if: steps.green.outputs.cache-hit != 'true'
        run: *pgfast
      - name: npm ci
        if: steps.green.outputs.cache-hit != 'true'
        run: npm ci --prefix web
      - name: playwright browsers
        if: steps.green.outputs.cache-hit != 'true'
        run: npx --prefix web playwright install --with-deps chromium
      # scripts/e2e.sh builds the SPA (running gen) and the binary itself.
      - name: e2e
        if: steps.green.outputs.cache-hit != 'true'
        run: bash scripts/e2e.sh
      - name: mark green
        if: steps.green.outputs.cache-hit != 'true'
        run: mkdir -p .e2e-green && echo "${{ steps.head.outputs.sha }}" > .e2e-green/sha
      - name: save green marker
        if: steps.green.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .e2e-green
          key: e2e-green-${{ steps.head.outputs.sha }}
      - name: playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: open or update the failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: "Daily e2e failing on claude/phase-1"
        run: |
          body="Daily e2e failed on \`${{ steps.head.outputs.sha }}\`: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          n="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi

  perf:
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc
          POSTGRES_DB: pcc_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U pcc -d pcc_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: perf + simulations
        run: go test -tags perf -count=1 -run 'TestPerf|TestSim' ./internal/gate/...
