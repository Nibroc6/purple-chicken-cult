# OpenAPI fragment of the theme module (plan §5.3). Owner: P1-W09.
# Paths are relative to /api. Schemas: module-prefixed names in this file, or
# $ref: '_common.yaml#/components/schemas/X'. Validated on its own by apitest.
#
# A theme is design tokens only (§15.2 A): a complete palette, a corner
# radius, a density, and a font from the allowlist at no less than the size
# floor. The server rejects a theme whose integrity elements (integrity_text
# on integrity_bg) fall below WCAG AA, or whose body text, muted text or
# links do (theme_contrast, field = the failing color). Tokens are not CSS;
# the client maps the values onto its own custom properties.
#
# Advanced mode (contract request p1-w09-3): `css` is theme CSS, a closed
# CSS-like dialect (gate/themes sheet.go), never raw CSS. A rule styles named
# parts of the app (page, card, button, like, ...) with allowlisted properties
# and bounded values; image(name) puts one of the theme's own uploads (`images`,
# refs from POST /media) on a part. No part reaches an integrity element. The
# server stores and returns the normalized source; theme_css (field
# css.<line>) names the first line it refuses, theme_contrast (field
# css.<line>) a rule whose text would fall below WCAG AA.
openapi: 3.0.3
info:
  title: pcc internal API (theme)
  version: "0"
paths:
  /me/theme:
    get:
      operationId: themeGet
      summary: The caller's theme (absent while they use the default)
      responses:
        "200":
          description: The theme
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeOut' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
    put:
      operationId: themeSet
      summary: Validate and store the caller's theme, replacing any earlier one
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThemeIn' }
      responses:
        "200":
          description: The stored theme, normalized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ThemeOut' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "422":
          description: theme_contrast (field = the color that failed, or css.<line>), theme_css (field css.<line>), theme_font (not on the allowlist) or theme_invalid (schema, range, size floor or images)
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/ThemeRateLimited' }
        "409": { $ref: '#/components/responses/ThemeMediaDisabled' }
    delete:
      operationId: themeClear
      summary: Go back to the default theme
      responses:
        "204": { description: "Default theme" }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/ThemeRateLimited' }
components:
  responses:
    ThemeMediaDisabled:
      description: '{"error":"feature_disabled","feature":"media"} — the theme CSS uses image() while media is off'
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
    ThemeRateLimited:
      description: rate_limited (account writes, 50/day).
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
  schemas:
    ThemeIn:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
        css: { type: string, maxLength: 16384, description: 'Theme CSS (advanced mode); empty or absent for none' }
        images:
          type: array
          maxItems: 8
          items: { $ref: '#/components/schemas/ThemeImageIn' }
    ThemeImageIn:
      type: object
      additionalProperties: false
      required: [name, ref]
      properties:
        name: { $ref: '#/components/schemas/ThemeImageName' }
        ref: { type: string, description: 'A fresh upload of the caller, or the ref of one of the theme''s current images' }
    ThemeImageName:
      type: string
      pattern: '^[a-z][a-z0-9-]{0,31}$'
    ThemeImage:
      type: object
      additionalProperties: false
      required: [name, ref, w, h]
      properties:
        name: { $ref: '#/components/schemas/ThemeImageName' }
        ref: { type: string }
        w: { type: integer }
        h: { type: integer }
    ThemeOut:
      type: object
      additionalProperties: false
      properties:
        theme: { $ref: '#/components/schemas/ThemeView' }
    ThemeView:
      type: object
      additionalProperties: false
      required: [tokens, css, images, updated_at]
      properties:
        tokens: { $ref: '#/components/schemas/ThemeTokens' }
        css: { type: string, description: 'Normalized theme CSS; empty for none' }
        images:
          type: array
          items: { $ref: '#/components/schemas/ThemeImage' }
        updated_at: { type: string, format: date-time }
    ThemeTokens:
      type: object
      additionalProperties: false
      required: [colors]
      properties:
        colors: { $ref: '#/components/schemas/ThemeColors' }
        radius: { type: integer, minimum: 0, maximum: 24, description: Corner radius in px }
        density: { type: string, enum: [compact, comfortable, spacious] }
        font: { type: string, enum: [system, serif, humanist, rounded, mono, hyperlegible] }
        font_size: { type: integer, minimum: 14, maximum: 24, description: 'Base text size in px (14 is the size floor)' }
    ThemeColors:
      type: object
      additionalProperties: false
      required: [bg, surface, text, muted, accent, border, integrity_bg, integrity_text]
      properties:
        bg: { $ref: '#/components/schemas/ThemeColor' }
        surface: { $ref: '#/components/schemas/ThemeColor' }
        text: { $ref: '#/components/schemas/ThemeColor' }
        muted: { $ref: '#/components/schemas/ThemeColor' }
        accent: { $ref: '#/components/schemas/ThemeColor' }
        border: { $ref: '#/components/schemas/ThemeColor' }
        integrity_bg: { $ref: '#/components/schemas/ThemeColor' }
        integrity_text: { $ref: '#/components/schemas/ThemeColor' }
    ThemeColor:
      type: string
      pattern: '^#[0-9a-fA-F]{6}$'
