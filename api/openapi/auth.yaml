# OpenAPI fragment of the auth module (plan §5.3). Owner: P0-W01 → P1-W07.
# Paths are relative to /api. Every unsafe request needs Sec-Fetch-Site
# same-origin (or absent), Origin equal to the configured origin and, once a
# session exists, X-PCC-CSRF; any failure is the uniform 404. WebAuthn options
# are the server's {"publicKey": {...}, "mediation"?} objects; credentials are
# PublicKeyCredential JSON (base64url fields).
openapi: 3.0.3
info:
  title: pcc internal API (auth)
  version: "0"
paths:
  /session:
    get:
      operationId: getSession
      description: >-
        The caller's session (works unauthenticated). With device-bound sessions on
        (PCC_DBSC=1), an unbound user session's answer carries a
        Sec-Session-Registration header offering the binding (P1). step_up is true
        while an automation-signal step-up is pending: every other request then
        answers step_up_required until the passkey step-up.
      responses:
        "200":
          description: The caller's session.
          headers:
            Sec-Session-Registration:
              description: DBSC registration offer (algorithms, path, single-use challenge).
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/SessionView' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "204": { description: Logged out (the session ends and the cookie is cleared). }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
  /auth/login/begin:
    post:
      operationId: loginBegin
      description: >-
        Starts a discoverable passkey login (conditional mediation). Sets a new guest
        session cookie that holds the challenge for two minutes; the previous session
        of the caller ends.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: WebAuthn request options and the CSRF token of the guest session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthBegin' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/login/finish:
    post:
      operationId: loginFinish
      description: >-
        Verifies the assertion and replaces the guest session with a new user session.
        Any failure (bad, replayed or expired assertion, unknown credential, account not
        active) is the uniform 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthCredentialIn' }
      responses:
        "200":
          description: The new session.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/SessionView' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/stepup/begin:
    post:
      operationId: stepUpBegin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: WebAuthn request options (allowCredentials = the own passkeys of the viewer).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthOptions' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/stepup/finish:
    post:
      operationId: stepUpFinish
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthCredentialIn' }
      responses:
        "204": { description: Verified; the session is fresh for five minutes. }
        "400":
          description: passkey_rejected (or bad_request).
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/passkeys:
    get:
      operationId: listPasskeys
      responses:
        "200":
          description: The passkeys of the viewer, oldest first.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuthPasskey' }
        "401": { $ref: '#/components/responses/AuthStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/passkeys/begin:
    post:
      operationId: addPasskeyBegin
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: WebAuthn creation options (excludeCredentials = the passkeys of the viewer).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthOptions' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/AuthStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/passkeys/finish:
    post:
      operationId: addPasskeyFinish
      description: >-
        Finishes adding a passkey. With {credential, name} (fresh step-up needed) the
        registration is verified; a session created by a passkey then gets 202
        {cosign: "passkey_add"}: the new credential waits five minutes for the
        co-signature of its PasskeyChange record by an EXISTING passkey (POST
        /api/cosign {purpose: passkey_add}), sent here as {intent, assertion}. Any
        other session stores it at once (204).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                credential: { type: object, additionalProperties: true }
                name: { type: string, maxLength: 200 }
                intent: { $ref: '_common.yaml#/components/schemas/Ref' }
                assertion: { type: object, additionalProperties: true }
      responses:
        "202":
          description: Verified; sign the PasskeyChange record with an existing passkey.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [cosign]
                properties:
                  cosign: { type: string, enum: [passkey_add] }
        "204": { description: The passkey was added; friends are notified. }
        "400":
          description: passkey_rejected (or bad_request).
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/AuthStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "422":
          description: passkey_name_invalid.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/passkeys/{id}:
    delete:
      operationId: removePasskey
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: '_common.yaml#/components/schemas/Ref' }
      description: >-
        Removes a passkey (never the last). A session created by a passkey sends the
        co-signature of the PasskeyChange record (POST /api/cosign {purpose:
        passkey_remove, target: id}) as {intent, assertion}; without it the removal
        is the uniform 404. Other sessions need a fresh step-up and no body.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [intent, assertion]
              properties:
                intent: { $ref: '_common.yaml#/components/schemas/Ref' }
                assertion: { type: object, additionalProperties: true }
      responses:
        "204": { description: Removed; every session it authenticated ended. }
        "400":
          description: passkey_rejected (or bad_request).
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "401": { $ref: '#/components/responses/AuthStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409":
          description: last_passkey.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /enroll/begin:
    post:
      operationId: enrollBegin
      description: >-
        Redeems the enrollment token from the URL fragment (never a path or query) and
        binds it to an enrollment session (a new cookie unless the current session is
        already bound to it). An invalid, used, cancelled, held or expired token is the
        uniform 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, maxLength: 64 }
      responses:
        "200":
          description: Registration options, the purpose and (recovery) the existing passkeys.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [options, purpose]
                properties:
                  options: { type: object, additionalProperties: true }
                  csrf: { type: string }
                  purpose: { type: string, enum: [genesis, recovery] }
                  tos_version: { type: integer, description: Genesis only; the terms version to accept. }
                  min_age: { type: integer, description: Genesis only; the minimum age to attest. }
                  existing_passkeys:
                    type: array
                    items: { $ref: '#/components/schemas/AuthPasskey' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /enroll/finish:
    post:
      operationId: enrollFinish
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [credential]
              properties:
                credential: { type: object, additionalProperties: true }
                remove_old: { type: boolean }
                tos_version: { type: integer }
                age_attested: { type: boolean }
      responses:
        "200":
          description: The new user session.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/SessionView' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "422":
          description: tos_required or age_required (genesis enrollment).
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/dbsc/register:
    post:
      operationId: dbscRegister
      description: >-
        Device Bound Session Credentials registration (P1), sent by the browser: the
        Sec-Session-Response header holds a JWT (ES256 or RS256, aud = this URL, jti =
        the offered challenge) signed by the device key it carries. The session becomes
        bound for good: from now on every request needs the 10-minute bound cookie
        (__Host-pcc-b), and the long-lived cookie alone is accepted only at
        /auth/dbsc/refresh. Any failure is the uniform 404 and burns the offer.
      parameters:
        - { name: Sec-Session-Response, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The DBSC session configuration; Set-Cookie carries the bound cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthDBSCConfig' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
  /auth/dbsc/refresh:
    post:
      operationId: dbscRefresh
      description: >-
        Renews the bound cookie of a bound session (the one request its long-lived
        cookie alone may make). Without Sec-Session-Response: 401 with a single-use
        Sec-Session-Challenge. With a JWT over that challenge (aud = this URL) signed
        by the registered key: a new bound cookie. A replayed or foreign proof is the
        uniform 404.
      parameters:
        - { name: Sec-Session-Response, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The DBSC session configuration; Set-Cookie carries the new bound cookie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthDBSCConfig' }
        "401":
          description: dbsc_challenge; sign the Sec-Session-Challenge and retry.
          headers:
            Sec-Session-Challenge:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AuthRateLimited' }
components:
  schemas:
    AuthDBSCConfig:
      type: object
      required: [session_identifier, refresh_url, scope, credentials]
      properties:
        session_identifier: { type: string }
        refresh_url: { type: string }
        scope:
          type: object
          properties:
            origin: { type: string }
            include_site: { type: boolean }
            defer_requests: { type: boolean }
        credentials:
          type: array
          items:
            type: object
            required: [type, name, attributes]
            properties:
              type: { type: string, enum: [cookie] }
              name: { type: string }
              attributes: { type: string }
    AuthOptions:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options: { type: object, additionalProperties: true }
    AuthBegin:
      type: object
      additionalProperties: false
      required: [options]
      properties:
        options: { type: object, additionalProperties: true }
        csrf: { type: string }
    AuthCredentialIn:
      type: object
      additionalProperties: false
      required: [credential]
      properties:
        credential: { type: object, additionalProperties: true }
    AuthPasskey:
      type: object
      additionalProperties: false
      required: [id, name, created_at, current]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Ref' }
        name: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        current: { type: boolean }
  responses:
    AuthStepUp:
      description: step_up_required (a fresh passkey verification is needed).
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
    AuthRateLimited:
      description: rate_limited.
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
