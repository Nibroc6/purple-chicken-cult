# OpenAPI fragment of the account module (plan §5.3). Owner: P0-W11 → P1-W10.
# Paths are relative to /api. Schemas: module-prefixed names in this file, or
# $ref: '_common.yaml#/components/schemas/X'. Validated on its own by apitest.
openapi: 3.0.3
info:
  title: pcc internal API (account)
  version: "0"
paths:
  /me:
    get:
      operationId: getMe
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/MeView' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
  /me/settings:
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '_common.yaml#/components/schemas/SettingsPatch' }
      responses:
        "200":
          description: The settings after the patch.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/SettingsView' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "422":
          description: >-
            display_name_invalid, locale_invalid, lang_invalid, translate_to_not_in_languages,
            preset_unavailable or ui_prefs_invalid.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /me/export:
    post:
      operationId: exportAccount
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          description: >-
            The export zip (records.jsonl, keys.json, posts.jsonl, credentials.jsonl,
            manifest.json). Needs a fresh step-up.
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /me/delete:
    post:
      operationId: deleteAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirm_handle]
              description: >-
                P1: a passkey session co-signs the AccountDelete record (intent from POST
                /api/cosign {purpose: account_delete} and the passkey assertion over its draft);
                without it the answer is the uniform 404.
              properties:
                confirm_handle: { type: string, maxLength: 64 }
                intent: { $ref: '_common.yaml#/components/schemas/Ref' }
                assertion: { type: object, additionalProperties: true }
      responses:
        "202": { description: Deletion accepted; every session is revoked. }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "422":
          description: confirm_mismatch.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /me/recovery:
    get:
      operationId: getRecoveryPending
      responses:
        "200":
          description: A pending manual recovery of the caller's own account (banner).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRecoveryPending' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
  /me/recovery/cancel:
    post:
      operationId: cancelRecovery
      responses:
        "204": { description: Any pending recovery of the caller's account is cancelled. }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /keys:
    get:
      operationId: getKeys
      responses:
        "200":
          description: The server's public signing keys with validity windows and fingerprints.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountKeys' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /mod/recovery:
    post:
      operationId: modRecoveryRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [subject]
              properties:
                subject: { $ref: '_common.yaml#/components/schemas/Ref' }
      responses:
        "201":
          description: The recovery request; its ID opens for every moderator.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: { $ref: '_common.yaml#/components/schemas/Ref' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409":
          description: recovery_self or recovery_exists.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /mod/recovery/{id}/approve:
    post:
      operationId: modRecoveryApprove
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Ref' } }
      requestBody:
        required: false
        description: >-
          P1 co-signature (required for a passkey session): the intent from POST /api/cosign
          {purpose: recovery_approve, target: id} and the passkey assertion over its draft.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCosignIn' }
      responses:
        "204": { description: Approved by a second moderator; the 24 h hold starts. }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409":
          description: second_moderator_required, recovery_self, recovery_not_open or recovery_expired.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /mod/recovery/{id}/link:
    get:
      operationId: modRecoveryLink
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Ref' } }
      responses:
        "200":
          description: The one-time enrollment link (second moderator, after the hold).
          content:
            application/json:
              schema:
                type: object
                required: [enroll_url]
                properties:
                  enroll_url: { type: string }
        "401": { $ref: '#/components/responses/AccountStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409":
          description: recovery_held or recovery_link_issued.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /recovery/sessions:
    post:
      operationId: recoveryStart
      description: >-
        P1. Guardian A (a friend+ of the account), in person with the recovering person, opens a
        recovery of that friend: an in-person handshake the recovering device scans at /recover.
        Opening again before the handshake passed replaces the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [friend]
              properties:
                friend: { $ref: '_common.yaml#/components/schemas/Ref' }
      responses:
        "201":
          description: The recovery handshake (the guardian's device renders the frames).
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/HandshakeView' }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409":
          description: recovery_exists (another recovery of the account is under way).
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /recovery/claim:
    post:
      operationId: recoveryClaim
      description: >-
        P1. The recovering device (guest session from POST /api/join/start) claims the guardian's
        code. The body is the handshake claim. The device then runs the SAS and the sound through
        /api/join/* and follows the recovery with the ticket (the guest session is short-lived).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload: { type: string }
                e_v: { type: string }
                sig_pub: { type: string }
                proof: { type: string }
      responses:
        "200":
          description: The recovery ticket for GET /api/recovery/status (X-PCC-Recovery).
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket: { type: string }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /recovery/requests:
    get:
      operationId: recoveryRequests
      description: >-
        P1. The recoveries waiting for the caller's approval as a second guardian: open, vouched
        in person by another friend+ of the account.
      responses:
        "200":
          description: Pending approvals.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AccountGuardianRequest' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /recovery/requests/{id}/approve:
    post:
      operationId: recoveryApprove
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: '_common.yaml#/components/schemas/Ref' } }
      description: >-
        P1. The second guardian's approval: starts the 24 h hold. Anyone who is not a guardian of
        the account gets the uniform 404.
      requestBody:
        required: false
        description: >-
          Co-signature (required for a passkey session): the intent from POST /api/cosign
          {purpose: recovery_approve, target: id} and the passkey assertion over its draft.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccountCosignIn' }
      responses:
        "204": { description: Approved; the 24 h hold starts and the account's friends are told. }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409":
          description: second_guardian_required or recovery_expired.
          content:
            application/json:
              schema: { $ref: '_common.yaml#/components/schemas/Error' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
  /recovery/status:
    get:
      operationId: recoveryStatus
      description: >-
        P1. The recovering device's view of its recovery, found by its ticket. Once released, every
        ask answers a fresh one-time enrollment URL (any earlier one stops working).
      parameters:
        - { name: X-PCC-Recovery, in: header, required: true, schema: { type: string, maxLength: 64 } }
      responses:
        "200":
          description: The recovery's state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountRecoveryStatus' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/AccountRateLimited' }
components:
  schemas:
    AccountKeys:
      type: object
      required: [server]
      properties:
        server:
          type: array
          items: { $ref: '_common.yaml#/components/schemas/KeyView' }
        mine:
          description: P1. The caller's own custodial signing keys.
          type: array
          items: { $ref: '_common.yaml#/components/schemas/KeyView' }
    AccountCosignIn:
      type: object
      additionalProperties: false
      properties:
        intent: { $ref: '_common.yaml#/components/schemas/Ref' }
        assertion: { type: object, additionalProperties: true }
    AccountGuardianRequest:
      type: object
      required: [id, account, expires_at]
      properties:
        id: { $ref: '_common.yaml#/components/schemas/Ref' }
        account:
          type: object
          required: [handle, display_name]
          properties:
            handle: { type: string }
            display_name: { type: string }
        expires_at: { type: string, format: date-time }
    AccountRecoveryStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [claimed, approving, holding, released, cancelled, expired] }
        release_at: { type: string, format: date-time }
        enroll_url: { type: string }
    AccountRecoveryPending:
      type: object
      properties:
        pending_until: { type: string, format: date-time }
  responses:
    AccountStepUp:
      description: step_up_required (a fresh passkey verification is needed).
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
    AccountRateLimited:
      description: rate_limited.
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
