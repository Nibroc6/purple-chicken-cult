# OpenAPI fragment of the mod module (plan §5.3). Owner: P0-W12 → P1-W06.
# Paths are relative to /api. Schemas: module-prefixed names in this file, or
# $ref: '_common.yaml#/components/schemas/X'. Validated on its own by apitest.
#
# Reports go to moderators only. A report about something the caller cannot see
# (or a garbage or foreign ref) answers exactly like a stored one, and every
# request is charged before its target is looked at. Moderator surfaces answer
# the uniform 404 to members; queue item ids and subject refs are
# moderator-scoped. Reasons and actions are closed codes. Phase 1: one queue for
# reports, CSAM holds (match metadata only, never content or a media URL),
# behavioral signals, step-up repeats and invite clusters; two-person actions
# are confirmed by a second moderator who co-signs the ModAction record.
openapi: 3.0.3
info:
  title: pcc internal API (mod)
  version: "0"
paths:
  /reports:
    post:
      operationId: report
      description: >-
        Reports a post, a person, an inviter (through the ref of the person they
        invited: the inviter is never addressable) or a misleading link preview
        (the post's ref). Always 202 for a signed-in caller with a valid reason,
        whether or not the target exists or is visible. Charged as a report write
        (20 a day).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModReportIn' }
      responses:
        "202": { description: Received. }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "422": { $ref: '_common.yaml#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /blame:
    get:
      operationId: blameInbox
      description: >-
        The caller's blame inbox, newest first: confirmed moderator actions on
        people they invited, with the reason code and the removed post only if
        the caller could see it. Listing marks the entries read.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: A page of blame entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModBlamePage' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/queue:
    get:
      operationId: modQueue
      description: >-
        Moderators only. Open queue items (reports, csam holds, signals,
        step-up repeats, invite clusters) by priority (csam first, then
        illegal), oldest first, with the subject (moderator-scoped ref and
        handle), the subject's inviter label and probation flag, the reported
        content (never for csam), the hold's match metadata for csam items, the
        claim, the two-person action awaiting a second moderator, and in the
        summary the confirmed-bad count of the subject's invite subtree
        (subtree_confirmed, quarantine_k) and the inviter's removed-account
        marks (inviter_marks).
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: A page of queue items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModQueuePage' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/items/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 256 } }
    post:
      operationId: modResolve
      description: >-
        Moderators only. remove_post (items with a post) and dismiss take one
        moderator and close the item (a report item: every open report on the
        same target). suspend_user, and dismissing a csam hold (which lifts the
        account's upload hold), need a passkey verification within 5 minutes
        and only start a two-person action that a different moderator confirms
        within 24 hours. An item claimed by another moderator is item_claimed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModResolveIn' }
      responses:
        "204": { description: "Done, or awaiting the second moderator." }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/ModStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409": { $ref: '_common.yaml#/components/responses/Problem' }
        "422": { $ref: '_common.yaml#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/items/{id}/claim:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 256 } }
    post:
      operationId: modClaim
      description: >-
        Moderators only. Claims the item for an hour (renews the caller's own
        claim): other moderators cannot resolve it or start an action on it
        meanwhile (item_claimed); a second moderator's confirmation is never
        blocked.
      responses:
        "204": { description: Claimed. }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409": { $ref: '_common.yaml#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/items/{id}/csam-report:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 256 } }
    post:
      operationId: modCSAMReport
      description: >-
        Moderators only, csam items only. Starts the two-person csam_report
        action with the NCMEC CyberTipline report reference; it is recorded on
        the hold (and the evidence kept a year after the report) when a second
        moderator confirms it. Needs a passkey verification within 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModCSAMReportIn' }
      responses:
        "204": { description: Awaiting the second moderator. }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/ModStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409": { $ref: '_common.yaml#/components/responses/Problem' }
        "422": { $ref: '_common.yaml#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/quarantine:
    post:
      operationId: modQuarantine
      description: >-
        Moderators only. Starts the two-person invite-tree quarantine of the
        subtree the item's subject belongs to (its root is the subject's
        inviter): needs at least PCC_QUARANTINE_K accounts of the subtree whose
        suspension two moderators confirmed since its last quarantine
        (quarantine_threshold) and none in the last 30 days
        (quarantine_active). On confirmation the subtree goes back to probation
        for 30 days and the root's invites pause for 30 days; a second offense
        revokes them. Needs a passkey verification within 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModQuarantineIn' }
      responses:
        "204": { description: Awaiting the second moderator. }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "401": { $ref: '#/components/responses/ModStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409": { $ref: '_common.yaml#/components/responses/Problem' }
        "422": { $ref: '_common.yaml#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/items/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, maxLength: 256 } }
    post:
      operationId: modConfirm
      description: >-
        The second moderator (not the one who started it) confirms the
        two-person action pending on the item within 24 hours, co-signing the
        exact ModAction record (POST /api/cosign {purpose: mod_action, target:
        the item id}) with their own passkey; a passkey session without the
        co-signature is the uniform 404. Sessions without a passkey (test
        hooks) need a verification within 5 minutes instead. Only then is the
        action applied and does the subject's inviter get a blame entry and a
        removed-account mark.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModConfirmIn' }
      responses:
        "204": { description: Confirmed and applied. }
        "401": { $ref: '#/components/responses/ModStepUp' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "409": { $ref: '_common.yaml#/components/responses/Problem' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /mod/log:
    get:
      operationId: modLog
      description: >-
        The public moderation log: confirmed removals and suspensions per day,
        reason and subject with a count. A subject is named only if the caller
        has that person in their horizon; otherwise it is a pseudonym.
      parameters:
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 256 } }
      responses:
        "200":
          description: A page of log entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModLogPage' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
  /csp-report:
    post:
      operationId: cspReport
      description: >-
        Content-Security-Policy violation reports (Reporting API or the legacy
        report-uri format). Only a count per violated directive and day is kept:
        no URLs, samples, user or address. Anonymous, rate-limited per network.
      requestBody:
        required: true
        content:
          application/reports+json:
            schema: { $ref: '#/components/schemas/ModCSPReports' }
          application/csp-report:
            schema: { $ref: '#/components/schemas/ModCSPLegacy' }
          application/json:
            schema: {}
      responses:
        "204": { description: Counted. }
        "400": { $ref: '_common.yaml#/components/responses/Problem' }
        "404": { $ref: '_common.yaml#/components/responses/NotFound' }
        "429": { $ref: '#/components/responses/ModRateLimited' }
components:
  schemas:
    ModReportIn:
      type: object
      required: [target, reason]
      additionalProperties: false
      properties:
        target:
          type: object
          required: [kind, ref]
          additionalProperties: false
          properties:
            kind: { type: string, enum: [post, person, inviter, preview] }
            ref: { type: string, maxLength: 256 }
        reason:
          type: string
          description: spam, bot, harassment, csam, illegal, impersonation, misleading_preview, other.
        note: { type: string, maxLength: 4000 }
    ModResolveIn:
      type: object
      required: [action, reason]
      additionalProperties: false
      properties:
        action:
          type: string
          description: remove_post, suspend_user, dismiss.
        reason:
          type: string
          description: spam, bot, harassment, csam, illegal, impersonation, misleading_preview, ban_evasion, other.
    ModConfirmIn:
      type: object
      additionalProperties: false
      properties:
        intent: { type: string, maxLength: 256 }
        assertion: { type: object, description: The WebAuthn get assertion over the ModAction draft. }
    ModCSAMReportIn:
      type: object
      required: [report_ref]
      additionalProperties: false
      properties:
        report_ref: { type: string, maxLength: 128 }
    ModQuarantineIn:
      type: object
      required: [subject_item]
      additionalProperties: false
      properties:
        subject_item: { type: string, maxLength: 256 }
        reason:
          type: string
          description: A moderation reason; defaults to the item's.
    ModQueuePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '_common.yaml#/components/schemas/ModItem' }
        next: { type: string }
    ModBlamePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '_common.yaml#/components/schemas/BlameItem' }
        next: { type: string }
    ModLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '_common.yaml#/components/schemas/LogItem' }
        next: { type: string }
    ModCSPReports:
      type: array
      items:
        type: object
        properties:
          type: { type: string }
          body: { type: object }
    ModCSPLegacy:
      type: object
      properties:
        csp-report: { type: object }
  responses:
    ModRateLimited:
      description: rate_limited (retry_after_s from the caller's own bucket).
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
    ModStepUp:
      description: step_up_required.
      content:
        application/json:
          schema: { $ref: '_common.yaml#/components/schemas/Error' }
