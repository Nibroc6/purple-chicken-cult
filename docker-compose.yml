# Local Postgres for dev and tests (plan §1, §4.3). Compatible with an existing
# container named pcc-postgres: scripts only run `docker compose up -d postgres`
# when no such container exists.
services:
  postgres:
    image: postgres:18
    container_name: pcc-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=400"]
    environment:
      POSTGRES_USER: pcc
      POSTGRES_PASSWORD: pcc
      POSTGRES_DB: pcc
    ports:
      - "54329:5432"
    volumes:
      - pcc-pgdata:/var/lib/postgresql
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcc -d pcc"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pcc-pgdata:
